name: Template CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # copier가 태그와 커밋으로 템플릿 버전을 판단한다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install copier
        run: pip install "copier>=9,<10"

      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - name: Run checks
        run: bash scripts/check.sh
